<div id="main-wrapper">
    <div id="album-art-container">
        <div id="album-art-layer"></div>
        <div id="album-art-transition-layer"></div>
        <div id="pause-overlay">
            <svg viewBox="0 0 24 24" style="fill: var(--accent-color, #ffffff);">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </div>
    </div>

    <div id="song-info-container">
        <div id="track-label" class="text-label">&nbsp;</div>
        <div id="artist-label" class="text-label">&nbsp;</div>
        <div id="progress-container">
            <div id="current-time" class="progress-text">0:00</div>
            <div id="progress-bar-track">
                <div id="progress-bar-fill"></div>
                <div></div>
            </div>
            <div id="duration" class="progress-text">0:00</div>
        </div>
    </div>
</div>
